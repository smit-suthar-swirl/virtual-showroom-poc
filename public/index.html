<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BYD 3D Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div class="app">

    <!-- 3D Viewport (70%) -->
    <div class="viewport" id="viewport">
      <canvas id="three-canvas"></canvas>
      <div class="car-label">BYD <span class="accent" id="car-name">Seal</span></div>
    </div>

    <!-- Control Panel (30%) -->
    <aside class="panel">
      <div class="panel-header">
        <h1>BYD <span>3D Viewer</span></h1>
        <p>Interactive Showroom</p>
      </div>

      <div class="panel-body">

        <!-- Models -->
        <section class="ctrl-section">
          <h3>Model</h3>
          <div class="btn-row">
            <button class="btn car-btn active" data-car="seal">Seal</button>
            <button class="btn car-btn" data-car="atto">Atto 3</button>
            <button class="btn car-btn" data-car="han">Han EV</button>
            <button class="btn car-btn" data-car="song">Song+</button>
            <button class="btn car-btn" data-car="qin">Qin</button>
          </div>
        </section>

        <!-- View -->
        <section class="ctrl-section">
          <h3>View</h3>
          <div class="btn-row">
            <button class="btn view-btn active" data-view="exterior">Exterior</button>
            <button class="btn view-btn" data-view="interior-1">Interior R1</button>
            <button class="btn view-btn" data-view="interior-2">Interior R2</button>
          </div>
        </section>

        <!-- Camera -->
        <section class="ctrl-section">
          <h3>Camera</h3>
          <div class="btn-grid">
            <button class="btn preset-btn" data-preset="front">Front</button>
            <button class="btn preset-btn" data-preset="rear">Rear</button>
            <button class="btn preset-btn" data-preset="side">Side</button>
            <button class="btn preset-btn" data-preset="quarter">3/4 View</button>
            <button class="btn preset-btn" data-preset="top">Top</button>
            <button class="btn preset-btn accent-btn" data-preset="360">360°</button>
          </div>
        </section>

        <!-- Actions -->
        <section class="ctrl-section">
          <h3>Actions</h3>
          <div class="btn-grid">
            <button class="btn action-btn" data-action="open_hood">Open Hood</button>
            <button class="btn action-btn" data-action="close_hood">Close Hood</button>
            <button class="btn action-btn" data-action="open_doors">Open Doors</button>
            <button class="btn action-btn" data-action="close_doors">Close Doors</button>
          </div>
        </section>

        <!-- Exterior Parts -->
        <section class="ctrl-section">
          <h3>Exterior Parts</h3>
          <div class="btn-grid">
            <button class="btn part-btn" data-part="headlights">Headlights</button>
            <button class="btn part-btn" data-part="taillights">Taillights</button>
            <button class="btn part-btn" data-part="wheels">Wheels</button>
            <button class="btn part-btn" data-part="grille">Grille</button>
            <button class="btn part-btn" data-part="hood">Hood</button>
            <button class="btn part-btn" data-part="trunk">Trunk</button>
            <button class="btn part-btn" data-part="doors">Doors</button>
            <button class="btn part-btn" data-part="mirrors">Mirrors</button>
            <button class="btn part-btn" data-part="body">Body</button>
            <button class="btn part-btn" data-part="windshield">Windshield</button>
          </div>
        </section>

        <!-- Interior Parts -->
        <section class="ctrl-section">
          <h3>Interior Parts</h3>
          <div class="btn-grid">
            <button class="btn part-btn" data-part="dashboard">Dashboard</button>
            <button class="btn part-btn" data-part="seats">Seats</button>
            <button class="btn part-btn" data-part="infotainment_screen">Screen</button>
            <button class="btn part-btn" data-part="steering_wheel">Steering</button>
            <button class="btn part-btn" data-part="center_console">Console</button>
            <button class="btn part-btn" data-part="instrument_cluster">Cluster</button>
          </div>
        </section>

        <!-- Color -->
        <section class="ctrl-section">
          <h3>Color</h3>
          <div class="color-swatches">
            <button class="color-btn" data-color="white"  style="background:#d0d4dc" title="White"></button>
            <button class="color-btn" data-color="black"  style="background:#222228" title="Black"></button>
            <button class="color-btn" data-color="silver" style="background:#b8bcc5" title="Silver"></button>
            <button class="color-btn" data-color="blue"   style="background:#2255aa" title="Blue"></button>
            <button class="color-btn" data-color="red"    style="background:#bb1830" title="Red"></button>
          </div>
        </section>

      </div><!-- /panel-body -->
    </aside>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/" } }
  </script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
